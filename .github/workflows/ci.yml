name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore .NET dependencies
        run: dotnet restore BloggerBazar.sln
      # Security 3: a known vulnerability in a package that ships to production fails the build (tests excluded).
      - name: Check production NuGet packages for known vulnerabilities
        run: |
          failed=0
          for project in src/*/*.csproj; do
            report=$(dotnet list "$project" package --vulnerable --include-transitive)
            echo "$report"
            if echo "$report" | grep -q "has the following vulnerable packages"; then failed=1; fi
          done
          exit $failed
      - name: Build backend
        run: dotnet build BloggerBazar.sln --configuration Release --no-restore
      - name: Run backend tests
        env:
          RUN_INTEGRATION_TESTS: "true"
        run: dotnet test BloggerBazar.sln --configuration Release --no-build --no-restore

  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      # Security 3: only what ships to users; build and test tools are updated by Dependabot.
      - name: Check production npm packages for known vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Audit translations
        run: npm run i18n:audit
      - name: Run frontend tests when present
        run: npm --workspace frontend run test --if-present
      - name: Build frontend
        run: npm --workspace frontend run build

  # The web admin site (admin-web): its own tests and production build; translations are audited above.
  admin-web:
    name: Admin web build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run admin web tests
        run: npm --workspace admin-web run test
      - name: Build admin web
        run: npm --workspace admin-web run build

  # The public landing site (landing): its own tests and production build; translations are audited above.
  landing:
    name: Landing build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run landing tests
        run: npm --workspace landing run test
      - name: Build landing
        run: npm --workspace landing run build

  # Every main screen at 360 and 320 px, RU/UZ, light/dark, against the API with the development seed:
  # fails on content outside the screen, cut-off labels and text below 3:1 contrast (frontend/e2e/screen-check.mjs).
  # The bot token and webhook secret below are throwaway values for this job's own API, not production secrets.
  screens:
    name: Phone screen check
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bb
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: bloggerbazar
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U bb" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://localhost:8080
      ConnectionStrings__Postgres: Host=localhost;Port=5432;Database=bloggerbazar;Username=bb;Password=ci
      Database__ApplyMigrationsOnStartup: "true"
      DevelopmentData__Seed: "true"
      Telegram__BotToken: "123456:CI-SCREEN-CHECK"
      Telegram__WebhookSecret: ci-screen-check-secret
      DealReminders__Enabled: "false"
      BotTips__Enabled: "false"
      RateLimiting__PermitLimit: "100000"
      RateLimiting__WritePermitLimit: "100000"
      SCREEN_CHECK_BOT_TOKEN: "123456:CI-SCREEN-CHECK"
      SCREEN_CHECK_WEBHOOK_SECRET: ci-screen-check-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start API and frontend
        run: |
          dotnet build src/BloggerBazar.Api --configuration Release
          nohup dotnet run --project src/BloggerBazar.Api --configuration Release --no-build --no-launch-profile > api.log 2>&1 &
          nohup npm --workspace frontend run dev -- --host 127.0.0.1 --port 5173 --strictPort > vite.log 2>&1 &
          for i in $(seq 1 90); do curl -sf http://localhost:8080/health > /dev/null && curl -sf http://127.0.0.1:5173/ > /dev/null && exit 0; sleep 2; done
          cat api.log vite.log; exit 1
      - name: Check screens
        run: npm --workspace frontend run screen-check
      - name: Upload screenshots of problems
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screen-check
          path: |
            frontend/e2e/output/
            api.log

  docker:
    name: Production Docker build validation
    needs: [backend, frontend, admin-web, landing]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API production image
        run: docker build --file src/BloggerBazar.Api/Dockerfile --tag bloggerbazar-api:ci .
      - name: Build frontend production image
        run: docker build --file frontend/Dockerfile --build-arg VITE_API_URL="" --tag bloggerbazar-frontend:ci .
      - name: Build admin site production image
        run: docker build --file admin-web/Dockerfile --tag bloggerbazar-admin-web:ci .
      # The image's entrypoint renders the nginx template from the environment, then nginx checks the result.
      - name: Check the admin site nginx configuration
        run: docker run --rm bloggerbazar-admin-web:ci nginx -t
      # The bot name here is a placeholder: the image only needs a well-formed one to build.
      - name: Build landing production image
        run: docker build --file landing/Dockerfile --build-arg BOT_USERNAME=BloggerBazarCiBot --tag bloggerbazar-landing:ci .
      - name: Check the landing nginx configuration
        run: docker run --rm bloggerbazar-landing:ci nginx -t
