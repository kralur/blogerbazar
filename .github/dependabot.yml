# Security 3: weekly update PRs; each goes through CI like any other change and is merged by hand.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # React and its types move together: half of the pair on its own never builds.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      dev-tools:
        dependency-type: development
    # Major versions that are a migration of their own, taken by hand as a planned package (status.md, 2026-11-20):
    # Tailwind 4, TypeScript 7, Vitest 5 and jsdom 31 fail the build of all three web apps. React went to 19 that
    # way (package L); its next major waits for the same treatment.
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # The managed SkiaSharp library and its native binaries must be the same version: SkiaSharp alone does not
      # restore, and the Linux binary alone builds and then throws on every picture (checked 2026-11-20).
      skiasharp:
        patterns:
          - "SkiaSharp"
          - "SkiaSharp.*"
    ignore:
      # MediatR 13 and later are no longer Apache-2.0: RPL-1.5 (publish your own source) or a paid licence key.
      # The project stays on 12.x; moving on is a product decision, not a version bump.
      - dependency-name: "MediatR"
        update-types: ["version-update:semver-major"]
      # The project targets .NET 10 (LTS, supported until November 2028) with EF Core 10. The tool and the packages
      # tied to the runtime stay on the 10 line; the next runtime is a planned package of its own, like this one was.
      - dependency-name: "dotnet-ef"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Npgsql.EntityFrameworkCore.PostgreSQL"
        update-types: ["version-update:semver-major"]
      # Serilog.AspNetCore follows the runtime line too: 11 brings Microsoft.Extensions 11 into a .NET 10 process.
      - dependency-name: "Serilog.AspNetCore"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
