<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>BloggerBazar</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F6F6F2; color: #0A0A0A; font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  @media (prefers-color-scheme: dark) { body { background: #090909; color: #F5F5F0; } p { color: #9A9A92 !important; } }
  main { width: min(22rem, calc(100% - 2rem)); text-align: center; }
  h1 { margin: 0 0 1.5rem; font-size: 1.75rem; font-weight: 800; letter-spacing: -.02em; }
  a { display: block; padding: 1.1rem; border-radius: 1rem; background: #C8FF00; color: #090909; font-size: 1.125rem; font-weight: 800; text-decoration: none; }
  p { margin: 1rem 0 0; color: #6F6F68; font-size: .875rem; }
</style>
</head>
<body>
<main>
  <h1 id="number"></h1>
  <a id="call" href="#"></a>
  <p id="hint"></p>
</main>
<script>
  // Telegram does not let a Mini App start a call on iPhone; this page opens in the browser, where tel: works.
  // Only digits and a leading "+" are accepted, so the page can never be pointed anywhere else.
  (function () {
    var params = new URLSearchParams(location.search);
    var number = (params.get("n") || "").replace(/[^\d+]/g, "");
    var uz = params.get("lang") === "uz";
    var valid = /^\+?\d{7,15}$/.test(number);
    // "+998 77 486 86 33" for Uzbek numbers, as everywhere in the app; other countries as typed.
    var uzLocal = /^\+998(\d{9})$/.exec(number);
    var shown = uzLocal ? "+998 " + uzLocal[1].replace(/(\d{2})(\d{3})(\d{2})(\d{2})/, "$1 $2 $3 $4") : number;
    document.getElementById("number").textContent = valid ? shown : "";
    var link = document.getElementById("call");
    link.textContent = uz ? "Qo‘ng‘iroq qilish" : "Позвонить";
    document.getElementById("hint").textContent = valid
      ? (uz ? "Tugmani bosing, telefon qo‘ng‘iroq qilishni taklif qiladi." : "Нажмите кнопку, и телефон предложит позвонить.")
      : (uz ? "Raqam topilmadi." : "Номер не найден.");
    if (!valid) { link.style.display = "none"; return; }
    link.href = "tel:" + number;
    location.href = "tel:" + number;
  })();
</script>
</body>
</html>
