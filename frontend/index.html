<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Blogger Marketplace</title>
    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
    <script>
      (function () {
        if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.colorScheme === "dark") {
          document.documentElement.dataset.telegramTheme = "dark";
        }
      }());
    </script>
    <style>
      html, body, #root { min-height: 100dvh; margin: 0; background: #F6F6F2; }
      html[data-telegram-theme="dark"], html[data-telegram-theme="dark"] body, html[data-telegram-theme="dark"] #root { background: #090909; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
