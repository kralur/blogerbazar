server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Speed: compress text files (the main script shrinks about three times) for phones far from the server.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        resolver 127.0.0.11 ipv6=off;
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        resolver 127.0.0.11 ipv6=off;
        set $api_health_upstream http://api:8080/health;
        proxy_pass $api_health_upstream;
    }

    # Vite names every built file by its content, so a phone may keep it for a year without asking again.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The page itself is always checked, so a new release reaches users on the next start.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
