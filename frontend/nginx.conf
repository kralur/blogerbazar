# A template: the nginx image renders ${...} from the environment when the container starts.
#   API_UPSTREAM            the API on the private network, e.g. http://${{API.RAILWAY_PRIVATE_DOMAIN}}:8080 on Railway;
#   NGINX_LOCAL_RESOLVERS   the container's DNS servers (set by the image from /etc/resolv.conf).
# D64 stage B: outside Telegram the page calls /api/ on its own address, so the browser session cookie stays
# first-party (HttpOnly, SameSite=Strict); inside Telegram the Mini App keeps calling the API's own address.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Speed: compress text files (the main script shrinks about three times) for phones far from the server.
    # API answers pass through here too (location /api/) and arrive with a Via header from Railway's edge; without
    # gzip_proxied nginx would leave such answers uncompressed, and the home page JSON is the biggest of them.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/problem+json image/svg+xml;

    location /api/ {
        # Looked up per request (not once at start), so the API can move inside the private network.
        resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;
        set $api_upstream ${API_UPSTREAM};
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;
        set $api_health_upstream ${API_UPSTREAM}/health;
        proxy_pass $api_health_upstream;
    }

    # Vite names every built file by its content, so a phone may keep it for a year without asking again.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # The page itself is always checked, so a new release reaches users on the next start.
    # Security B4: Content-Security-Policy in report-only mode. Nothing is blocked; the app sends what would be
    # (src/security/cspReporter.ts) and admins read it, then the header becomes Content-Security-Policy.
    # The sha256 is the inline theme script in index.html; tests/csp-policy.test.ts keeps them in step.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://telegram.org 'sha256-5a2qAOcwpTZHbgAe+zLrIxCJuriobER3zhfAu39p8KU='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; media-src 'self' https:; frame-ancestors 'self' https://web.telegram.org https://*.telegram.org; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        try_files $uri $uri/ /index.html;
    }
}
