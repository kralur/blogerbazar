services:
  api:
    build:
      context: .
      dockerfile: src/BloggerBazar.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379
      Telegram__BotToken: ${TELEGRAM_BOT_TOKEN}
      Telegram__BotUsername: ${TELEGRAM_BOT_USERNAME}
      Telegram__MiniAppUrl: ${TELEGRAM_MINIAPP_URL}
      Telegram__WebhookSecret: ${TELEGRAM_WEBHOOK_SECRET}
      Payments__ContactUnlockAmountUzs: ${PAYMENTS__CONTACTUNLOCKAMOUNTUZS}
      Click__TelegramProviderToken: ${CLICK__TELEGRAMPROVIDERTOKEN}
      Administration__TelegramUserIds__0: ${ADMINISTRATION__TELEGRAMUSERIDS__0}
      RateLimiting__PermitLimit: ${RATE_LIMITING__PERMITLIMIT}
      RateLimiting__WindowSeconds: ${RATE_LIMITING__WINDOWSECONDS}
      Cors__AllowedOrigins__0: ${FRONTEND_URL}
      Database__ApplyMigrationsOnStartup: "true"
    ports:
      - "127.0.0.1:${API_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ""
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
